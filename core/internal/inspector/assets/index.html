<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atomyx Inspector</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/main.js"></script>
</head>
<body>
  <header class="bar">
    <h1 class="brand">Atomyx Inspector</h1>
    <dl class="session" id="session">
      <div><dt>Device</dt><dd id="session-device">-</dd></div>
      <div><dt>Platform</dt><dd id="session-platform">-</dd></div>
      <div><dt>Kind</dt><dd id="session-kind">-</dd></div>
      <div><dt>Holder</dt><dd id="session-holder">-</dd></div>
    </dl>
    <button type="button" id="refresh">Refresh</button>
  </header>
  <div id="fatal" class="banner banner-error" role="alert" hidden></div>
  <div id="released" class="banner banner-warn" role="status" hidden></div>
  <div id="notice" class="banner banner-info" role="status" hidden></div>
  <main class="layout" id="layout" hidden>
    <section class="pane pane-shot" aria-label="Screenshot">
      <div class="shot-frame">
        <img id="screenshot" alt="Latest device screenshot" hidden>
        <div id="highlight" class="highlight" hidden></div>
        <p id="screenshot-empty" class="muted">No screenshot yet.</p>
      </div>
      <p id="highlight-note" class="note" role="status" hidden></p>
    </section>
    <section class="pane pane-tree" aria-label="UI tree">
      <div class="tree-tools">
        <input type="search" id="search" placeholder="Search id, label, text, hint, role" autocomplete="off" spellcheck="false">
        <span id="search-count" class="muted" aria-live="polite"></span>
      </div>
      <div id="tree-viewport" class="tree-viewport" tabindex="0" role="tree">
        <div id="tree-spacer" class="tree-spacer"></div>
        <div id="tree-rows" class="tree-rows"></div>
      </div>
      <p id="tree-empty" class="muted">No tree yet. Press Refresh.</p>
    </section>
    <section class="pane pane-panels" id="panels" aria-label="Details"></section>
  </main>
</body>
</html>
