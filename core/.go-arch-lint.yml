version: 3
workdir: .

allow:
  depOnAnyVendor: true
  ignoreNotFoundComponents: true

commonComponents:
  - clock
  - logging
  - version

components:
  clock:
    in: internal/clock
  logging:
    in: internal/logging
  version:
    in: internal/version
  diag:
    in: internal/diag
  wire:
    in: internal/wire
  transport:
    in: internal/transport
  driver:
    in: internal/driver
  drivermock:
    in: internal/driver/mock
  drivertest:
    in: internal/driver/drivertest
  process:
    in: internal/process
  shutdown:
    in: internal/shutdown
  androiddriver:
    in: internal/androiddriver
  iosdriver:
    in: internal/iosdriver
  iossimdriver:
    in: internal/iossimdriver
  orchestra:
    in: internal/orchestra
  script:
    in: internal/script
  expression:
    in: internal/script/expression
  runner:
    in: internal/runner
  scenario:
    in: internal/scenario
  netcapture:
    in: internal/netcapture
  conformance:
    in: internal/conformance
  device:
    in: internal/device
  suite:
    in: internal/suite
  sidecar:
    in: internal/sidecar
  cli:
    in: internal/cli
  skills:
    in: internal/skills
  storage:
    in: internal/storage
  mcp:
    in: internal/mcp
  config:
    in: internal/config
  report:
    in: internal/report
  flock:
    in: internal/flock
  storageroot:
    in: internal/storageroot
  lease:
    in: internal/lease
  attach:
    in: internal/attach
  runfolder:
    in: internal/runfolder
  history:
    in: internal/history
  session:
    in: internal/session
  sessiontest:
    in: internal/session/sessiontest
  inspector:
    in: internal/inspector
  redact:
    in: internal/redact
  stepstream:
    in: internal/stepstream
  debugrun:
    in: internal/debugrun
  recording:
    in: internal/recording
  shard:
    in: internal/shard
  setup:
    in: internal/setup
  cmd:
    in: cmd/**
  scripttools:
    in: scripts/**

deps:
  diag:
    mayDependOn:
      - diag
  wire:
    anyVendorDeps: true
  transport:
    mayDependOn:
      - wire
      - diag
  driver:
    mayDependOn:
      - wire
      - transport
  drivermock:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - drivertest
      - diag
  drivertest:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - diag
  process:
    anyVendorDeps: true
    mayDependOn:
      - diag
  shutdown:
    mayDependOn:
      - shutdown
  androiddriver:
    mayDependOn:
      - wire
      - transport
      - driver
      - process
      - androiddriver
      - drivertest
      - diag
  iosdriver:
    mayDependOn:
      - wire
      - transport
      - driver
      - process
      - iosdriver
      - drivertest
      - diag
  iossimdriver:
    mayDependOn:
      - wire
      - transport
      - driver
      - process
      - iosdriver
      - iossimdriver
      - drivertest
      - diag
  orchestra:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - diag
  script:
    mayDependOn:
      - wire
      - driver
      - orchestra
  runner:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - orchestra
      - script
      - expression
      - diag
      - redact
  scenario:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - orchestra
      - script
      - runner
  netcapture:
    mayDependOn:
      - runner
  conformance:
    anyProjectDeps: true
  device:
    mayDependOn:
      - wire
      - driver
      - androiddriver
      - iosdriver
      - iossimdriver
      - transport
      - orchestra
      - process
      - drivermock
      - diag
  suite:
    anyVendorDeps: true
  sidecar:
    mayDependOn:
      - wire
      - device
      - driver
      - drivermock
      - orchestra
      - process
      - script
      - expression
      - runner
      - scenario
      - sessiontest
  cli:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - orchestra
      - script
      - expression
      - runner
      - device
      - netcapture
      - report
      - config
      - scenario
      - suite
      - skills
      - diag
      - session
      - runfolder
      - inspector
      - lease
      - shutdown
      - storageroot
      - storage
      - sessiontest
      - redact
      - stepstream
      - debugrun
      - recording
      - shard
      - setup
      - history
  skills:
    anyVendorDeps: true
  storage:
    anyVendorDeps: true
    mayDependOn:
      - runfolder
      - storageroot
  mcp:
    mayDependOn:
      - wire
      - driver
      - drivermock
      - orchestra
      - script
      - expression
      - runner
      - device
      - storage
      - diag
      - netcapture
      - session
      - sessiontest
      - runfolder
      - stepstream
      - debugrun
      - recording
  config:
    anyVendorDeps: true
  report:
    mayDependOn:
      - runner
      - scenario
      - config
      - runfolder
  flock:
    mayDependOn:
      - flock
  storageroot:
    mayDependOn:
      - storageroot
  lease:
    mayDependOn:
      - diag
      - flock
  runfolder:
    mayDependOn:
      - flock
  history:
    mayDependOn:
      - runfolder
      - diag
  stepstream:
    mayDependOn:
      - runner
      - runfolder
  attach:
    mayDependOn:
      - wire
      - diag
  session:
    mayDependOn:
      - wire
      - diag
      - driver
      - orchestra
      - script
      - expression
      - device
      - lease
      - attach
      - runfolder
      - shutdown
      - session
      - drivermock
      - drivertest
      - sessiontest
  sessiontest:
    mayDependOn:
      - lease
      - attach
      - device
      - driver
      - orchestra
  redact:
    mayDependOn:
      - redact
  debugrun:
    mayDependOn:
      - diag
      # expression, wire, driver and drivermock are imported by tests only.
      - expression
      - wire
      - driver
      - drivermock
      - script
      - orchestra
      - runner
      - session
      - debugrun
  recording:
    mayDependOn:
      - device
      - runfolder
      - diag
      - recording
  shard:
    mayDependOn:
      - process
      - shard
  setup:
