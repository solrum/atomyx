format: atomyx/v1
appId: dev.atomyx.demo
name: Composed flow, combining requires and runFlow
description: |
  Demonstrates flow composition. `requires` runs the sign-in flow
  before the script's own steps so the test starts on a known,
  logged-in account. `runFlow` invokes a sign-out sub-flow inline at
  the end so the app returns to a known state regardless of which UI
  path the test took. Both sub-flows share this script's variables.
tags:
  - composition
  - sub-flow
requires:
  - examples/flows/sign-in.yml
env:
  email: qa+composed@atomyx.test
  password: super-secret
---
# At this point sign-in has already run: the account is signed in
# and the app is sitting on the Dashboard.

- assertVisible: "Welcome"

# Navigate into Settings and back, so the composed flow does more
# than the sub-flows alone would.
- tap: "Settings"
- waitFor: "Settings"
- tap: "Dark Mode"
- pressKey: back

# Polls, because the back transition's animation is still settling
# when this step starts.
- assertVisible:
    text: "Dashboard"
    timeout: 5000
- screenshot: composed-flow-done

# Inline composition. The sign-out file's steps execute as if they
# were inlined here, including any nested handle, branch, or
# capture they declare.
- runFlow:
    file: examples/flows/sign-out.yml
