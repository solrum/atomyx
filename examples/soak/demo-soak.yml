format: atomyx/v1
appId: dev.atomyx.demo
name: Demo app soak
description: |
  One short pass over the launch, typing, navigation, scroll, gesture,
  wait, and assertion paths of the demo app. Platform neutral, so the
  same file runs on Android and iOS. Meant to be repeated many times by
  scripts/soak.sh to measure how often the infrastructure fails.
  Permission and location steps are left out on purpose, because a
  physical Android device cannot do them and a script step cannot be
  conditioned on the platform.
tags:
  - soak
env:
  email: soak@example.com
  password: secret123

# A relaunch can restore a signed-in session, so the flow must start
# from Sign in whatever the app shows. When Sign in is not on screen,
# the setup launches the app and signs out if the Dashboard is showing.
preconditions:
  - check:
      visible: "Sign in"
    setup:
      - launchApp
      - handle:
          - when:
              visible: "Dashboard"
            do:
              - tap: "Sign out"
              - waitFor: "Confirm"
              - tap: "Confirm"
              - waitFor: "Sign in"
          - otherwise: skip
---
- launchApp
- waitFor:
    text: "Sign in"
    timeout: 10000

- type:
    into: "Email"
    text: ${email}
- type:
    into: "Password"
    text: ${password}
- tap: "Login"
- waitFor:
    text: "Dashboard"
    timeout: 10000
- assertVisible: "Welcome"

- tap: "Products"
- waitFor:
    text: "Product A"
    timeout: 10000
- assertVisible: "Product B"
- swipe: up
- swipe: down
- assertVisible: "Product A"
- back
- waitFor:
    text: "Dashboard"
    timeout: 10000

- tap: "Gestures"
- waitFor:
    id: "gesture-longpress-target"
    timeout: 10000
- longPress:
    at:
      id: "gesture-longpress-target"
    holdMs: 700
- assertVisible:
    id: "gesture-longpress-count"
    timeout: 5000
- repeat:
    times: 2
    commands:
      - swipe: up
      - swipe: down
- assertVisible:
    id: "gesture-tap-target"

# A tap in landscape proves gestures and the hierarchy agree on the
# rotated screen. The device is turned back before the flow goes on.
- setOrientation: landscapeLeft
- waitFor:
    id: "gesture-tap-target"
    timeout: 10000
- tap:
    id: "gesture-tap-target"
- assertVisible:
    text:
      regex: "^Tap count: [1-9]"
    timeout: 5000
- setOrientation: portrait
- waitFor:
    id: "gesture-tap-target"
    timeout: 10000
- back
- waitFor:
    text: "Dashboard"
    timeout: 10000

# The link lands on the sign-in screen, which the next run starts from.
- retry:
    maxRetries: 1
    commands:
      - openLink: atomyxdemo://open/login
      - waitFor:
          text: "Sign in"
          timeout: 10000

- pressKey: home
