format: atomyx/v1
appId: dev.atomyx.demo
name: Run timeline demo
description: |
  Exercises every step variant the run dock renders so you can
  verify the new colored tokens + `line N · Xms` sub-line at a
  glance. Open this file in Studio, hit Play, and watch each row
  light up with its keyword (orange), selector identifier
  (cyan), value (green), and source-line metadata.
tags:
  - demo
  - timeline
env:
  email: qa+run42@atomyx.test
  password: super-secret-123
  username: hieu

# The demo app keeps its navigation state across a plain relaunch, so
# a prior run that ended on the Dashboard leaves the Dashboard on
# screen instead of the Sign in screen this script expects. Sign out
# first when that is the case, so the script always starts from the
# same known screen.
preconditions:
  - check:
      notVisible: "Dashboard"
    setup:
      - tap: "Sign out"
      - waitFor: "Confirm"
      - tap: "Confirm"
      - waitFor: "Sign in"
---
# Top-of-flow boot
- launchApp
- sleep: 500

# Selector-driven query, using a text selector on a labeled element
- waitFor: "Sign in"

# Tap with a string-shorthand text selector
- tap: "Sign in"

# Type-into with explicit selector, a role-and-position field with secret masked
- type:
    into:
      role: text-field
      nth: 0
    text: ${email}
- type:
    into:
      role: text-field
      nth: 1
    text: ${password}

# Tap with a structured selector + role narrow
- tap:
    text: "Login"
    role: button

# Assertion + screenshot for evidence
- assertVisible: "Welcome"
- screenshot: dashboard-loaded

# Gesture
- swipe: up

# Branching: handle two possible follow-up screens
- handle:
    - when:
        visible: "Enter OTP"
      do:
        - type:
            into:
              role: text-field
              nth: 0
            text: "123456"
        - tap:
            text: "Verify"
            role: button
    - when:
        visible: "Notifications"
      do:
        - tap: "Allow"
        - waitFor: "Dashboard"
    - otherwise: skip

# Navigate forward one screen, then back with an explicit key press.
# The Dashboard route replaced Sign in on the navigation stack, so
# pressing back from Dashboard itself would exit the app instead of
# just popping a route. Push Settings first, so back has somewhere
# in-app to return to.
- tap: "Settings"
- waitFor: "Settings"
- pressKey: back

# Final assert + closing screenshot. Polls, because the back
# transition's animation is still settling when this step starts.
- assertVisible:
    text: "Dashboard"
    timeout: 5000
- screenshot: end-of-flow
