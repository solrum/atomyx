format: atomyx/v1
appId: dev.atomyx.demo
name: Login flow, with OTP branching
description: Test login with handle for OTP vs direct dashboard
tags:
  - login
  - branching
env:
  email: otp@example.com
  password: secret123
  otp_code: "123456"

# The demo app keeps its navigation state across a plain relaunch, so
# a prior run that ended on the Dashboard leaves the Dashboard on
# screen instead of the Sign in screen this script expects. Sign out
# first when that is the case, so the script always starts from the
# same known screen.
preconditions:
  - check:
      notVisible: "Dashboard"
    setup:
      - tap: "Sign out"
      - waitFor: "Confirm"
      - tap: "Confirm"
      - waitFor: "Sign in"
---
- launchApp
- sleep: 1000
- waitFor: "Sign in"

# The into selector taps the field to focus it first, because the
# text is entered into whichever field currently holds focus.
- type:
    into:
      role: text-field
      nth: 0
    text: ${email}
- type:
    into:
      role: text-field
      nth: 1
    text: ${password}
- tap: "Login"

# Handle: OTP screen or Dashboard. `when: visible` polls the tree so
# there's no need for an explicit sleep after tapping Login, since the
# branch that lights up fires as soon as the transition renders.
- handle:
    - when:
        visible: "Enter OTP"
      do:
        - type:
            into:
              role: text-field
              nth: 0
            text: ${otp_code}
        - tap:
            label: "Verify"
            role: button
        - waitFor:
            text: "Dashboard"
            timeout: 10000
    - when:
        visible: "Dashboard"
      do:
        - screenshot: direct_login
    - otherwise: fail

- assertVisible: "Welcome"
- screenshot: login_complete
